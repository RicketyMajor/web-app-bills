name: Keep Supabase awake

# Free-tier Supabase projects pause after ~7 days without activity.
# One small query every ~3 days keeps the database awake; a failed run means it's unreachable.
# ponytail: GitHub disables scheduled workflows after 60 days without repo activity — re-enable it in the Actions tab if that happens.
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database through the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        # RLS returns no rows to the anon key, but the request still reaches Postgres
        run: >
          curl --fail --silent --show-error --max-time 30
          -H "apikey: $SUPABASE_ANON_KEY"
          "${SUPABASE_URL%/}/rest/v1/categories?select=id&limit=1"
